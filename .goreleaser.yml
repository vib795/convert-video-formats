# GoReleaser configuration for convert-vid
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: convert-vid
    ldflags:
      - -s -w
      - -X github.com/vib795/convert-vid-format/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

brews:
  - name: convert-vid
    repository:
      owner: vib795
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vib795/convert-video-formats"
    description: "A fast CLI tool for converting video files between different formats"
    license: "MIT"
    install: |
      bin.install "convert-vid"
    test: |
      system "#{bin}/convert-vid", "version"
    dependencies:
      - name: ffmpeg
        type: runtime